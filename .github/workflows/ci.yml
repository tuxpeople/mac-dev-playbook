---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 5 * * 4"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      # Ansible does not run on Python 3.15 yet, see renovate.json
      - name: Set up Python 3.14.
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'

      - name: Install test dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pip3 install -r requirements.txt yamllint

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint

      - name: Run shellcheck.
        run: shellcheck init.sh

  requirements-check:
    name: Check Python Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.14.
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'

      - name: Install requirements.txt.
        run: |
          pip3 install --upgrade pip
          pip3 install -r requirements.txt

      - name: Verify Ansible can be imported.
        run: |
          python3 -c "import ansible; print(f'Ansible version: {ansible.__version__}')"

      - name: Check for dependency conflicts.
        run: |
          pip3 check

      - name: Verify ansible-playbook works.
        run: |
          ansible-playbook --version

      - name: Check for security vulnerabilities.
        run: |
          pip3 install safety
          safety check --json || true

  # The playbooks need Vault, 1Password and iCloud, a real run is not possible
  # here. A syntax check catches broken YAML, tasks and missing roles.
  syntax:
    name: Playbook Syntax
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: tests/ansible.cfg
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.14.
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'

      - name: Install test dependencies.
        run: |
          pip3 install -r requirements.txt
          ansible-galaxy install -r requirements.yml

      - name: Test the playbooks' syntax.
        run: |
          for playbook in main.yml plays/*.yml; do
            echo "Checking ${playbook}"
            ansible-playbook "${playbook}" --syntax-check
          done
