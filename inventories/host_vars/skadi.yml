# Template for new Mac host configuration
# Copy this file to <hostname>.yml and customize

# Username for ansible connection
ansible_user: tdeutsch

# Sudo password (encrypted with ansible-vault)
# Generate with:
#   ansible-vault encrypt_string \
#     --vault-password-file=~/Library/Mobile\ Documents/com~apple~CloudDocs/Dateien/Allgemein/bin/vault_password_file  \
#     'your-sudo-password' \
#     --name 'ansible_become_pass'
#
# Or if vault_password_file is not available:
#   ansible-vault encrypt_string --ask-vault-pass 'your-sudo-password' --name 'ansible_become_pass'
#
ansible_become_pass: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  64363032373334643761626362376335633265303635396439656137363030393134366635613536
  3130323934616266356464353336343130373963666234650a633936613966396164326138323830
  38393636646132613238646464666235393236313134613164386265363239353138626537633666
  3366323066643265630a643734663539386463326462393935613466396432373837393462396336
